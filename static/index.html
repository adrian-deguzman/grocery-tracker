<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Deep black background */
            color: #FFFFFF;
        }
        /* Hide number input arrows for cleaner UI */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="pb-24 antialiased">

    <div class="max-w-md mx-auto relative">
        
        <div class="pt-12 pb-6 px-6">
            <p class="text-[#8E8E93] text-sm font-medium mb-1">Your report</p>
            <h1 class="text-[3.5rem] leading-none font-bold tracking-tight">₱<span id="grand-total">0.00</span></h1>
        </div>

        <details class="group bg-[#1C1C1E] p-5 rounded-[28px] shadow-xl mb-8 mx-4" open>
            <summary class="flex justify-between items-center text-white font-medium text-lg px-1 cursor-pointer list-none select-none [&::-webkit-details-marker]:hidden">
                <h2>Add New Item</h2>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#8E8E93] transition-transform duration-300 group-open:-rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            
            <div class="mt-5">
                <input type="text" id="itemName" placeholder="Item Name" 
                       class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all">
                
                <div class="flex items-center gap-3 mb-3">
                    <input type="number" id="itemPrice" placeholder="Price (₱)" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all" step="0.5">
                    
                    <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                    
                    <input type="number" id="itemQty" placeholder="Qty" value="1" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all">
                </div>
                
                <input type="file" id="itemImage" accept="image/*" 
                       class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all mb-5">
                
                <button onclick="addItem()" class="w-full bg-[#B3A8FF] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                    Add to Cart
                </button>
            </div>
        </details>

        <div class="px-4">
            <h2 class="text-[1.35rem] font-medium text-white mb-4 px-2">Item List</h2>
            <div id="cart-list" class="flex flex-col gap-3">
                </div>
        </div>

    </div>

    <div id="editModal" class="hidden fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md transition-opacity">
        <div class="bg-[#1C1C1E] p-6 rounded-[28px] shadow-2xl w-full max-w-md border border-[#2C2C2E]">
            <h2 class="text-white font-medium text-xl mb-5 px-1">Edit Item</h2>
            
            <input type="hidden" id="editItemId">
            
            <input type="text" id="editItemName" placeholder="Item Name" 
                   class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
            
            <div class="flex items-center gap-3 mb-3">
                <input type="number" id="editItemPrice" placeholder="Price (₱)" 
                       class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all" step="0.5">
                
                <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                
                <input type="number" id="editItemQty" placeholder="Qty" 
                       class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
            </div>
            
            <p class="text-[#8E8E93] text-xs font-medium px-1 mb-1 mt-2">Update Image (Optional)</p>
            <div class="flex items-center gap-3 mb-6">
                <img id="editImagePreview" src="" class="hidden w-[50px] h-[50px] object-cover rounded-[14px] bg-[#2C2C2E] flex-shrink-0 border border-[#3A3A3C]">
                
                <input type="file" id="editItemImage" accept="image/*" 
                       class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all">
            </div>

            <div class="flex gap-3">
                <button onclick="closeEditModal()" class="w-1/3 bg-[#2C2C2E] text-white font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                    Cancel
                </button>
                <button onclick="saveEdit()" class="w-2/3 bg-[#A7E4C5] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="hidden fixed inset-0 z-[110] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-lg">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white bg-[#2C2C2E] w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#3A3A3C] transition-all active:scale-90 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        
        <img id="fullScreenImage" src="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl mb-8 border border-[#2C2C2E]">
        
        <a id="downloadImageBtn" href="" download="" class="bg-[#B3A8FF] text-black font-semibold px-6 py-3.5 rounded-[18px] active:scale-95 transition-transform flex items-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            Save Photo
        </a>
    </div>

    <script>
        // --- Globals ---
        let currentEditingSelectedState = true;
        let currentEditingImage = null; // Keeps track of existing image in edit mode

        window.onload = fetchItems;

        async function fetchItems() {
            const response = await fetch('/api/cart');
            const items = await response.json();
            renderList(items);
        }

        async function addItem() {
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            const qty = parseInt(document.getElementById('itemQty').value) || 1;
            const imageFile = document.getElementById('itemImage').files[0];

            if (!name) return alert("Need a name!");

            let imageB64 = null;
            if (imageFile) {
                imageB64 = await toBase64(imageFile);
            }

            const payload = { name, price, qty, image: imageB64, selected: true };

            await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemImage').value = '';
            fetchItems();
        }

        async function toggleItem(id, itemDataStr) {
            const itemData = JSON.parse(decodeURIComponent(itemDataStr));
            itemData.selected = !itemData.selected;
            await fetch(`/api/cart/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            });
            fetchItems();
        }

        async function deleteItem(id) {
            // Add slight delay to allow scale animation to play before deleting
            setTimeout(async () => {
                await fetch(`/api/cart/${id}`, { method: 'DELETE' });
                fetchItems();
            }, 100);
        }

        // --- Edit Modal Logic ---
        function openEditModal(itemDataStr) {
            const item = JSON.parse(decodeURIComponent(itemDataStr));
            
            document.getElementById('editItemId').value = item.id;
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemPrice').value = item.price;
            document.getElementById('editItemQty').value = item.qty;
            document.getElementById('editItemImage').value = ''; // Reset file input
            
            currentEditingSelectedState = item.selected;
            currentEditingImage = item.image; // Keep existing image in memory
            
            // Show the previous image preview if it exists
            const previewImg = document.getElementById('editImagePreview');
            if (item.image) {
                previewImg.src = item.image;
                previewImg.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewImg.classList.add('hidden');
            }
            
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEdit() {
            const id = document.getElementById('editItemId').value;
            const name = document.getElementById('editItemName').value;
            const price = parseFloat(document.getElementById('editItemPrice').value) || 0;
            const qty = parseInt(document.getElementById('editItemQty').value) || 1;
            const imageFile = document.getElementById('editItemImage').files[0];

            if (!name) return alert("Need a name!");

            let imageB64 = currentEditingImage; // Default to old image
            if (imageFile) {
                imageB64 = await toBase64(imageFile); // Overwrite if new uploaded
            }

            const payload = { name, price, qty, image: imageB64, selected: currentEditingSelectedState };

            await fetch(`/api/cart/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeEditModal();
            fetchItems();
        }

        // --- Image Modal Logic ---
        function openImageModal(imgSrc, itemName) {
            document.getElementById('fullScreenImage').src = imgSrc;
            
            const downloadBtn = document.getElementById('downloadImageBtn');
            downloadBtn.href = imgSrc;
            
            // Format name: "Item Name" -> "Item_Name.png"
            const safeName = itemName.replace(/\s+/g, '_');
            downloadBtn.download = `${safeName}.png`;
            
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('fullScreenImage').src = "";
        }

        // --- UI Rendering ---
        function renderList(items) {
            const listDiv = document.getElementById('cart-list');
            listDiv.innerHTML = '';
            let total = 0;

            if (items.length === 0) {
                listDiv.innerHTML = '<p class="text-[#8E8E93] italic px-2">Your list is currently empty.</p>';
            }

            items.forEach(item => {
                if (item.selected) {
                    total += (item.price * item.qty);
                }

                const formattedPrice = item.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                
                // Encode object so we can pass it securely inside HTML strings without breaking quotes
                const itemDataStr = encodeURIComponent(JSON.stringify(item));
                
                // Fix escaping for image name parameter
                const safeImageName = item.name.replace(/'/g, "\\'");

                const itemHTML = `
                    <div class="bg-[#1C1C1E] p-4 rounded-[24px] flex items-center gap-4 transition-all hover:bg-[#252528]">
                        
                        <div class="flex-shrink-0 flex items-center justify-center z-10">
                            <input type="checkbox" class="w-[22px] h-[22px] accent-[#A7E4C5] rounded-md cursor-pointer border-0 bg-[#2C2C2E]" ${item.selected ? 'checked' : ''} 
                                   onchange="toggleItem('${item.id}', '${itemDataStr}')">
                        </div>
                        
                        <div class="flex-grow cursor-pointer" onclick="openEditModal('${itemDataStr}')">
                            <p class="font-semibold text-lg text-white leading-tight tracking-wide">${item.name}</p>
                            <p class="text-[#8E8E93] text-[13px] font-medium mt-1 tracking-wide">${item.qty} x ₱${formattedPrice}</p>
                        </div>
                        
                        ${item.image ? `<img src="${item.image}" onclick="openImageModal('${item.image}', '${safeImageName}')" class="w-[50px] h-[50px] object-cover rounded-[14px] bg-[#2C2C2E] cursor-pointer hover:opacity-80 transition-opacity z-10">` : ''}
                        
                        <button onclick='deleteItem("${item.id}")' class="text-[#8E8E93] hover:text-red-400 active:scale-90 transition-all text-xl font-bold pl-2 pr-1 z-10">✕</button>
                    </div>
                `;
                listDiv.innerHTML += itemHTML;
            });

            document.getElementById('grand-total').innerText = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
