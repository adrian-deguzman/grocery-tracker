<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pb-24 antialiased">

    <div class="max-w-md mx-auto relative">
        
        <div class="pt-12 pb-6 px-6 relative">
            <p class="text-[#8E8E93] text-sm font-medium mb-1">Total Cost</p>
            <div class="flex items-center gap-4">
                <h1 id="total-container" class="text-[3.5rem] leading-none font-bold tracking-tight transition-opacity duration-300">₱<span id="grand-total">0.00</span></h1>
                
                <div id="loading-spinner" class="hidden w-8 h-8 border-4 border-[#2C2C2E] border-t-[#A7E4C5] rounded-full animate-spin"></div>
            </div>
        </div>

        <details class="group bg-[#1C1C1E] p-5 rounded-[28px] shadow-xl mb-8 mx-4" open>
            <summary class="flex justify-between items-center text-white font-medium text-lg px-1 cursor-pointer list-none select-none [&::-webkit-details-marker]:hidden">
                <h2>Add New Item</h2>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#8E8E93] transition-transform duration-300 group-open:-rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            
            <div class="mt-5">
                <input type="text" id="itemName" placeholder="Item Name" 
                       class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all">
                
                <div class="flex items-center gap-3 mb-3">
                    <input type="number" id="itemPrice" placeholder="Price (₱)" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all" step="0.5">
                    
                    <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                    
                    <input type="number" id="itemQty" placeholder="Qty" value="1" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all">
                </div>
                
                <input type="file" id="itemImage" accept="image/*" 
                       class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all mb-5">
                
                <button onclick="addItem()" class="w-full bg-[#B3A8FF] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                    Add to Cart
                </button>
            </div>
        </details>

        <div class="px-4">
            <h2 class="text-[1.35rem] font-medium text-white mb-4 px-2">Item List</h2>
            <div id="cart-list" class="flex flex-col gap-3">
                </div>
        </div>

    </div>

    <div id="editModal" class="opacity-0 pointer-events-none fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md transition-opacity duration-300">
        <div id="editModalInner" class="bg-[#1C1C1E] p-6 rounded-[28px] shadow-2xl w-full max-w-md border border-[#2C2C2E] scale-95 transition-transform duration-300">
            <h2 class="text-white font-medium text-xl mb-5 px-1">Edit Item</h2>
            
            <input type="hidden" id="editItemId">
            
            <input type="text" id="editItemName" placeholder="Item Name" 
                   class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
            
            <div class="flex items-center gap-3 mb-3">
                <input type="number" id="editItemPrice" placeholder="Price (₱)" 
                       class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all" step="0.5">
                
                <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                
                <input type="number" id="editItemQty" placeholder="Qty" 
                       class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
            </div>
            
            <p class="text-[#8E8E93] text-xs font-medium px-1 mb-1 mt-2">Update Image (Optional)</p>
            <div class="flex items-center gap-3 mb-6">
                <img id="editImagePreview" src="" class="hidden w-[50px] h-[50px] object-cover rounded-[14px] bg-[#2C2C2E] flex-shrink-0 border border-[#3A3A3C]">
                
                <input type="file" id="editItemImage" accept="image/*" 
                       class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all">
            </div>

            <div class="flex gap-3">
                <button onclick="closeEditModal()" class="w-1/3 bg-[#2C2C2E] text-white font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                    Cancel
                </button>
                <button onclick="saveEdit()" class="w-2/3 bg-[#A7E4C5] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform flex items-center justify-center">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="opacity-0 pointer-events-none fixed inset-0 z-[110] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-lg transition-opacity duration-300">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white bg-[#2C2C2E] w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#3A3A3C] transition-all active:scale-90 shadow-lg z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        
        <img id="fullScreenImage" src="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl mb-8 border border-[#2C2C2E] scale-95 transition-transform duration-300">
        
        <a id="downloadImageBtn" href="" download="" class="bg-[#B3A8FF] text-black font-semibold px-6 py-3.5 rounded-[18px] active:scale-95 transition-transform flex items-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            Save Photo
        </a>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
