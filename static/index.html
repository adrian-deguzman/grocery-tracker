<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#000000] text-white h-screen flex justify-center antialiased overflow-hidden">

    <div class="w-full max-w-md h-full flex flex-col relative bg-[#000000]">
        
        <header class="flex-none pt-12 pb-4 px-6 border-b border-[#1C1C1E] bg-[#000000] z-40">
            <p class="text-[#8E8E93] text-sm font-medium mb-1">Grand Total</p>
            <div class="flex items-center gap-4">
                <h1 id="total-container" class="text-[3rem] leading-none font-bold tracking-tight transition-opacity duration-300">
                    ₱<span id="grand-total">0.00</span>
                </h1>
                <div id="loading-spinner" class="hidden w-8 h-8 border-4 border-[#2C2C2E] border-t-[#A7E4C5] rounded-full animate-spin"></div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar relative">
            
            <section id="view-to-buy" class="block pb-24">
                <div class="sticky top-0 bg-[#000000]/90 backdrop-blur-md z-30 p-4 border-b border-[#1C1C1E]">
                    <div class="relative">
                        <input type="text" id="quickAddInput" onkeypress="handleQuickAdd(event)" placeholder="Quick Add Item (Press Enter)..." 
                               class="w-full bg-[#1C1C1E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#B3A8FF] transition-all pr-14 shadow-lg">
                        <div class="absolute right-2 top-1/2 -translate-y-1/2 text-[#8E8E93] pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        </div>
                    </div>
                </div>

                <div id="planned-list" class="p-4 flex flex-col gap-3">
                    </div>
            </section>

            <section id="view-cart" class="hidden pb-24">
                <div id="incart-list" class="p-4 flex flex-col gap-3">
                    </div>
            </section>
        </main>

        <button onclick="openAddModal()" class="absolute bottom-[6.5rem] right-6 bg-[#A7E4C5] text-black w-14 h-14 rounded-[20px] shadow-[0_8px_16px_rgba(167,228,197,0.15)] flex items-center justify-center active:scale-95 transition-transform z-40">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>

        <nav class="flex-none bg-[#0A0A0B]/95 backdrop-blur-xl border-t border-[#1C1C1E] pb-safe z-50">
            <div class="flex justify-around items-center h-[4.5rem] px-2">
                
                <button id="nav-to-buy" onclick="switchTab('to-buy')" class="flex-1 flex flex-col items-center gap-1 text-[#B3A8FF] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span class="text-[11px] font-semibold tracking-wide">To Buy</span>
                </button>
                
                <button id="nav-cart" onclick="switchTab('cart')" class="flex-1 flex flex-col items-center gap-1 text-[#8E8E93] hover:text-white transition-colors">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span id="cart-badge" class="hidden absolute -top-1.5 -right-2.5 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center border-2 border-[#0A0A0B]">
                            0
                        </span>
                    </div>
                    <span class="text-[11px] font-semibold tracking-wide">Cart</span>
                </button>

            </div>
        </nav>

        <div id="addModal" class="opacity-0 pointer-events-none fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md transition-opacity duration-300">
            <div id="addModalInner" class="bg-[#1C1C1E] p-6 rounded-[28px] shadow-2xl w-full max-w-md border border-[#2C2C2E] scale-95 transition-transform duration-300">
                <h2 class="text-white font-medium text-xl mb-5 px-1">Add Unplanned Item</h2>
                
                <input type="text" id="itemName" placeholder="Item Name" 
                       class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
                
                <div class="flex items-center gap-3 mb-3">
                    <input type="number" id="itemPrice" placeholder="Price (₱)" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all" step="0.5">
                    <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                    <input type="number" id="itemQty" placeholder="Qty" value="1"
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
                </div>
                
                <p class="text-[#8E8E93] text-xs font-medium px-1 mb-1 mt-2">Item Image (Optional)</p>
                <input type="file" id="itemImage" accept="image/*" 
                       class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all mb-6">
                
                <div class="flex gap-3">
                    <button onclick="closeAddModal()" class="w-1/3 bg-[#2C2C2E] text-white font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                        Cancel
                    </button>
                    <button onclick="addItem()" class="w-2/3 bg-[#A7E4C5] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <div id="editModal" class="opacity-0 pointer-events-none fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md transition-opacity duration-300">
            <div id="editModalInner" class="bg-[#1C1C1E] p-6 rounded-[28px] shadow-2xl w-full max-w-md border border-[#2C2C2E] scale-95 transition-transform duration-300">
                <h2 id="editModalTitle" class="text-white font-medium text-xl mb-5 px-1">Edit Item</h2>
                
                <input type="hidden" id="editItemId">
                
                <input type="text" id="editItemName" placeholder="Item Name" 
                       class="w-full bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] mb-3 focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
                
                <div class="flex items-center gap-3 mb-3">
                    <input type="number" id="editItemPrice" placeholder="Price (₱)" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all" step="0.5">
                    <span class="text-[#8E8E93] font-bold text-xl mb-1">×</span>
                    <input type="number" id="editItemQty" placeholder="Qty" 
                           class="w-1/2 bg-[#2C2C2E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all">
                </div>
                
                <p class="text-[#8E8E93] text-xs font-medium px-1 mb-1 mt-2">Update Image (Optional)</p>
                <div class="flex items-center gap-3 mb-6">
                    <img id="editImagePreview" src="" class="hidden w-[50px] h-[50px] object-cover rounded-[14px] bg-[#2C2C2E] flex-shrink-0 border border-[#3A3A3C]">
                    <input type="file" id="editItemImage" accept="image/*" 
                           class="w-full text-sm text-[#8E8E93] file:mr-4 file:py-2.5 file:px-4 file:rounded-[14px] file:border-0 file:text-sm file:font-medium file:bg-[#2C2C2E] file:text-white hover:file:bg-[#3A3A3C] transition-all">
                </div>

                <div class="flex gap-3">
                    <button onclick="closeEditModal()" class="w-1/3 bg-[#2C2C2E] text-white font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform">
                        Cancel
                    </button>
                    <button onclick="saveEdit()" id="editSaveBtn" class="w-2/3 bg-[#A7E4C5] text-black font-semibold text-lg py-3.5 rounded-[18px] active:scale-95 transition-transform flex items-center justify-center">
                        Save
                    </button>
                </div>
            </div>
        </div>

        <div id="imageModal" class="opacity-0 pointer-events-none fixed inset-0 z-[110] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-lg transition-opacity duration-300">
            <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white bg-[#2C2C2E] w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#3A3A3C] transition-all active:scale-90 shadow-lg z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <img id="fullScreenImage" src="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl mb-8 border border-[#2C2C2E] scale-95 transition-transform duration-300">
            <a id="downloadImageBtn" href="" download="" class="bg-[#B3A8FF] text-black font-semibold px-6 py-3.5 rounded-[18px] active:scale-95 transition-transform flex items-center gap-2 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                Save Photo
            </a>
        </div>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
