<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#000000] text-white h-screen flex justify-center antialiased overflow-hidden">

    <div class="w-full max-w-md h-full flex flex-col relative bg-[#000000]">
        
        <header class="flex-none pt-12 pb-4 px-6 border-b border-[#1C1C1E] bg-[#000000] z-50">
            <p class="text-[#8E8E93] text-sm font-medium mb-1">Grand Total</p>
            <div class="flex items-center gap-4">
                <h1 id="total-container" class="text-[3rem] leading-none font-bold tracking-tight transition-opacity duration-300">
                    ₱<span id="grand-total">0.00</span>
                </h1>
                <div id="loading-spinner" class="hidden w-8 h-8 border-4 border-[#2C2C2E] border-t-[#A7E4C5] rounded-full animate-spin"></div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar relative">
            
            <section id="view-to-buy" class="block pb-24">
                
                <div class="sticky top-0 bg-[#000000]/90 backdrop-blur-md z-40 p-4 border-b border-[#1C1C1E]">
                    <div class="relative">
                        <input type="text" id="quickAddInput" placeholder="Quick Add Item..." 
                               class="w-full bg-[#1C1C1E] text-white placeholder-[#8E8E93] px-4 py-3.5 rounded-[18px] focus:outline-none focus:ring-2 focus:ring-[#A7E4C5] transition-all pr-14 shadow-lg">
                        <button class="absolute right-2 top-1/2 -translate-y-1/2 bg-[#A7E4C5] text-black w-9 h-9 rounded-[12px] font-bold flex items-center justify-center active:scale-95 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>

                <div class="p-4 flex flex-col gap-3">
                    <h2 class="text-[1.15rem] font-medium text-white mb-1 px-1">Planned Items</h2>
                    
                    <div class="bg-[#1C1C1E] p-4 rounded-[24px] flex items-center justify-between transition-all">
                        <div>
                            <p class="font-semibold text-lg text-white leading-tight tracking-wide">Fresh Atlantic Salmon</p>
                            <p class="text-[#8E8E93] text-[13px] font-medium mt-1 tracking-wide">Qty: 1</p>
                        </div>
                        <button class="flex-shrink-0 ml-3 bg-[#B3A8FF] text-black text-sm font-semibold px-4 py-2.5 rounded-[14px] active:scale-95 transition-transform shadow-lg">
                            Add to Cart
                        </button>
                    </div>
                    
                    <div class="bg-[#1C1C1E] p-4 rounded-[24px] flex items-center justify-between transition-all">
                        <div>
                            <p class="font-semibold text-lg text-white leading-tight tracking-wide">Organic Avocados</p>
                            <p class="text-[#8E8E93] text-[13px] font-medium mt-1 tracking-wide">Qty: 3</p>
                        </div>
                        <button class="flex-shrink-0 ml-3 bg-[#B3A8FF] text-black text-sm font-semibold px-4 py-2.5 rounded-[14px] active:scale-95 transition-transform shadow-lg">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </section>

            <section id="view-cart" class="hidden pb-24">
                <div class="p-4 flex flex-col gap-3">
                    <div class="flex justify-between items-center mb-1 px-1 mt-2">
                        <h2 class="text-[1.15rem] font-medium text-white">In Cart</h2>
                        <button class="text-[#A7E4C5] text-sm font-semibold hover:opacity-80">Clear All</button>
                    </div>
                    
                    <div class="bg-[#1C1C1E] p-4 rounded-[24px] flex items-center gap-4 transition-all">
                        <div class="flex-shrink-0 flex items-center justify-center">
                            <input type="checkbox" checked class="w-[22px] h-[22px] accent-[#A7E4C5] rounded-md cursor-pointer border-0 bg-[#2C2C2E]">
                        </div>
                        
                        <div class="flex-grow">
                            <p class="font-semibold text-lg text-white leading-tight tracking-wide">Almond Milk</p>
                            <p class="text-[#8E8E93] text-[13px] font-medium mt-1 tracking-wide">2 x ₱180.00</p>
                        </div>
                        
                        <div class="w-[50px] h-[50px] bg-[#2C2C2E] rounded-[14px] flex items-center justify-center text-[#8E8E93] text-xs font-medium border border-[#3A3A3C]">
                            Img
                        </div>
                        
                        <button class="text-[#8E8E93] hover:text-red-400 active:scale-90 transition-all text-xl font-bold pl-1 pr-1">✕</button>
                    </div>

                    <div class="bg-[#1C1C1E] p-4 rounded-[24px] flex items-center gap-4 transition-all">
                        <div class="flex-shrink-0 flex items-center justify-center">
                            <input type="checkbox" checked class="w-[22px] h-[22px] accent-[#A7E4C5] rounded-md cursor-pointer border-0 bg-[#2C2C2E]">
                        </div>
                        <div class="flex-grow">
                            <p class="font-semibold text-lg text-white leading-tight tracking-wide">Whole Wheat Bread</p>
                            <p class="text-[#8E8E93] text-[13px] font-medium mt-1 tracking-wide">1 x ₱95.50</p>
                        </div>
                        <button class="text-[#8E8E93] hover:text-red-400 active:scale-90 transition-all text-xl font-bold pl-2 pr-1">✕</button>
                    </div>
                </div>
            </section>
            
            <div id="cart-list" class="hidden"></div>
            
        </main>

        <button class="absolute bottom-[6.5rem] right-6 bg-[#A7E4C5] text-black w-14 h-14 rounded-[20px] shadow-[0_8px_16px_rgba(167,228,197,0.15)] flex items-center justify-center active:scale-95 transition-transform z-40">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>

        <nav class="flex-none bg-[#0A0A0B]/95 backdrop-blur-xl border-t border-[#1C1C1E] pb-safe z-50">
            <div class="flex justify-around items-center h-[4.5rem] px-2">
                
                <button class="flex-1 flex flex-col items-center gap-1 text-[#B3A8FF] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span class="text-[11px] font-semibold tracking-wide">To Buy</span>
                </button>
                
                <button class="flex-1 flex flex-col items-center gap-1 text-[#8E8E93] hover:text-white transition-colors">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span class="absolute -top-1.5 -right-2.5 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center border-2 border-[#0A0A0B]">
                            2
                        </span>
                    </div>
                    <span class="text-[11px] font-semibold tracking-wide">Cart</span>
                </button>

            </div>
        </nav>

        <div id="editModal" class="opacity-0 pointer-events-none fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-md transition-opacity duration-300">
            </div>
        <div id="imageModal" class="opacity-0 pointer-events-none fixed inset-0 z-[110] bg-black/95 flex flex-col items-center justify-center p-4 backdrop-blur-lg transition-opacity duration-300">
            </div>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
